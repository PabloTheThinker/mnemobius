[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemobius"
version = "0.1.0"
description = "A Möbius memory core for Hermes agents: learn passively from every session, deliver the lesson at the moment it matters, and grade your own advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Navarro" }]
keywords = ["hermes", "agent", "memory", "experience", "patterns", "plugin"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mnemobius = "mnemobius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mnemobius = ["hermes_plugin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
